<!DOCTYPE HTML>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/css/edit-style.css}" rel="stylesheet" />
    <title>Edycja studenta</title>
</head>
<body>
<div class="root" th:with="isDelete=${#strings.equalsIgnoreCase(param.delete, 'true')}">
    <form action="#" th:action="@{/studentEdit}" th:object="${student}" method="POST"
          th:with="akcja=*{studentId} ? (${isDelete} ? 'delete' : 'update') : 'create',
                       opis=*{studentId} ? (${isDelete} ? 'Usuń' : 'Aktualizuj') : 'Utwórz'" autocomplete="off">

        <h1 th:text="${opis} + ' studenta'">Edytuj studenta</h1>

        <div class="err" th:if="${#fields.hasErrors('*')}">
            BŁĘDY:
            <ul>
                <li th:each="err: ${#fields.errors('*')}" th:text="${err}">Wprowadzone dane są niepoprawne!</li>
            </ul>
        </div>

        <div class="container">
            <div class="btns-panel">
                <input class="btn" type="submit" name="create" value="create" th:name="${akcja}" th:value="${opis}" />
                <input class="btn" type="submit" name="cancel" value="Anuluj" />
            </div>

            <div th:if="*{studentId}">
                <label for="studentId" class="lbl">Id:</label>
                <input id="studentId" th:field="*{studentId}" class="fld" readonly />
            </div>

            <div>
                <label for="projektIds" class="lbl">Projekty (przytrzymaj CTRL, aby wybrać kilka):</label>
                <select id="projektIds" name="projektIds" class="fld" multiple="multiple" size="5">
                    <option th:each="p : ${projekty}"
                            th:value="${p.projektId}"
                            th:text="${p.nazwa}"
                            th:selected="${wybraneProjektIds != null and wybraneProjektIds.contains(p.projektId)}">
                        Nazwa projektu
                    </option>
                </select>
            </div>

            <div>
                <label for="imie" class="lbl">Imię:</label>
                <input id="imie" th:field="*{imie}" class="fld" th:class="${#fields.hasErrors('imie')} ? 'err' : 'fld'" size="45" />
                <span class="err" th:if="${#fields.hasErrors('imie')}" th:errors="*{imie}">Error</span>
            </div>

            <div>
                <label for="nazwisko" class="lbl">Nazwisko:</label>
                <input id="nazwisko" th:field="*{nazwisko}" class="fld" th:class="${#fields.hasErrors('nazwisko')} ? 'err' : 'fld'" size="45" />
                <span class="err" th:if="${#fields.hasErrors('nazwisko')}" th:errors="*{nazwisko}">Error</span>
            </div>

            <div>
                <label for="nrIndeksu" class="lbl">Nr indeksu:</label>
                <input id="nrIndeksu" th:field="*{nrIndeksu}" class="fld" th:class="${#fields.hasErrors('nrIndeksu')} ? 'err' : 'fld'" size="20" />
                <span class="err" th:if="${#fields.hasErrors('nrIndeksu')}" th:errors="*{nrIndeksu}">Error</span>
            </div>

            <div>
                <label for="email" class="lbl">Email:</label>
                <input id="email" th:field="*{email}" class="fld" th:class="${#fields.hasErrors('email')} ? 'err' : 'fld'" size="45" />
                <span class="err" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</span>
            </div>

            <div>
                <label for="stacjonarny" class="lbl">Stacjonarny:</label>
                <input type="checkbox" id="stacjonarny" th:field="*{stacjonarny}" class="fld" />
            </div>
        </div>
    </form>
</div>
</body>
</html>
