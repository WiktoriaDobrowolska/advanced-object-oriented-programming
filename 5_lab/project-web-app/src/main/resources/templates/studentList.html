<!DOCTYPE HTML>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link th:href="@{/css/list-style.css}" rel="stylesheet" />
  <title>Lista studentów</title>
</head>
<body>
<div class="root">
  <h1>Lista studentów</h1>
  <p>
    <a th:href="@{/projektList}">Lista Projektów</a> |
    <a th:href="@{/zadanieList}">Lista zadań</a>
  </p>
  <p>
    <a th:href="@{/studentEdit}">Dodaj studenta</a>
  </p>

  <form class="search-block" th:action="@{/studentList}" method="get">
    <label for="nazwisko">Szukaj po nazwisku:</label>
    <input id="nazwisko" type="text" name="nazwisko" th:value="${nazwisko}" />
    <input type="hidden" name="size" th:value="${studentPage.size}" />
    <input class="btn" type="submit" value="Szukaj" />
    <a th:href="@{/studentList}">Wyczyść</a>
  </form>

  <table>
    <thead>
    <tr>
      <th>Id</th>
      <th>Projekty</th>
      <th>Imię</th>
      <th>Nazwisko</th>
      <th>Nr indeksu</th>
      <th>Email</th>
      <th>Stacjonarny</th>
      <th>Edit</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="student: ${studenci}">
      <td th:text="${student.studentId}">Id</td>
      <td>
        <span th:if="${student.projekty == null or student.projekty.size() == 0}">-</span>
        <span th:each="p, iter : ${student.projekty}" th:text="${p.nazwa} + (${!iter.last} ? ', ' : '')"></span>
      </td>
      <td th:text="${student.imie}">Imię</td>
      <td th:text="${student.nazwisko}">Nazwisko</td>
      <td th:text="${student.nrIndeksu}">Nr indeksu</td>
      <td th:text="${student.email}">Email</td>
      <td th:text="${student.stacjonarny} ? 'Tak' : 'Nie'">Stacjonarny</td>
      <td>
        <a th:href="@{/studentEdit(studentId=${student.studentId})}">Edytuj</a><br>
        <a th:href="@{/studentEdit(studentId=${student.studentId}, delete='true')}">Usuń</a>
      </td>
    </tr>
    </tbody>
  </table>

  <div class="pagination" th:if="${studentPage.totalPages > 1}">
    <a th:if="${studentPage.hasPrevious()}"
       th:href="@{/studentList(page=${studentPage.number - 1}, size=${studentPage.size}, nazwisko=${nazwisko})}">Poprzednia</a>
    <span th:text="|Strona ${studentPage.number + 1} z ${studentPage.totalPages}|"></span>
    <a th:if="${studentPage.hasNext()}"
       th:href="@{/studentList(page=${studentPage.number + 1}, size=${studentPage.size}, nazwisko=${nazwisko})}">Następna</a>
  </div>
</div>
</body>
</html>
